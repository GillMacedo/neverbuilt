# Example workflow for checking Go files that the test job's CI builds cover.
name: Example CI with neverbuilt

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            tags: ""
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            tags: integration
          - runner: windows-latest
            goos: windows
            goarch: amd64
            tags: ""
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            tags: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: Run tests
        shell: bash
        env:
          TAGS: ${{ matrix.tags }}
          CGO_ENABLED: "0"
        run: |
          if [ -z "$TAGS" ]; then
            go test ./...
          else
            go test -tags="$TAGS" ./...
          fi

  neverbuilt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      # Keep this list in entry-for-entry sync with the test job's matrix above.
# Findings (neverbuilt exit 1) and incomplete checks (neverbuilt exit 2)
# both cause go run to exit non-zero and fail this job.
      - name: Check untracked build files with neverbuilt
        run: >-
          go run github.com/GillMacedo/neverbuilt/plugin/scripts@v0.1.0
          --dir .
          --ci linux/amd64
          --ci linux/amd64,integration
          --ci windows/amd64
          --ci darwin/arm64
